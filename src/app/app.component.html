<ion-app>
  <!-- Global Side Navigation Menu -->
  <ion-menu menuId="main-menu" contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>Navigation</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding-vertical">
      <div class="menu-intro-container">
        <span class="menu-app-badge">Application Portal</span>
      </div>

      <ion-list lines="none" class="nav-menu-list">
        <!-- 1. Home -->
        <ion-menu-toggle autoHide="false">
          <ion-item
            button
            routerLink="/tabs/tab1"
            routerDirection="root"
            routerLinkActive="selected-menu-item"
            [routerLinkActiveOptions]="{ exact: true }"
            detail="false"
            class="nav-menu-item"
          >
            <ion-icon slot="start" name="home-outline" aria-hidden="true"></ion-icon>
            <ion-label>Home</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- 2. Profile -->
        <ion-menu-toggle autoHide="false">
          <ion-item
            button
            routerLink="/tabs/tab1"
            routerDirection="root"
            routerLinkActive="selected-menu-item"
            detail="false"
            class="nav-menu-item"
          >
            <ion-icon slot="start" name="person-outline" aria-hidden="true"></ion-icon>
            <ion-label>Profile</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- 3. Settings -->
        <ion-menu-toggle autoHide="false">
          <ion-item
            button
            routerLink="/settings"
            routerDirection="forward"
            routerLinkActive="selected-menu-item"
            detail="false"
            class="nav-menu-item"
          >
            <ion-icon slot="start" name="settings-outline" aria-hidden="true"></ion-icon>
            <ion-label>Settings</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- 4. System -->
        <ion-menu-toggle autoHide="false">
          <ion-item
            button
            routerLink="/system"
            routerDirection="forward"
            routerLinkActive="selected-menu-item"
            detail="false"
            class="nav-menu-item"
          >
            <ion-icon slot="start" name="hardware-chip-outline" aria-hidden="true"></ion-icon>
            <ion-label>System</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- 5. Dashboard -->
        <ion-menu-toggle autoHide="false">
          <ion-item
            button
            routerLink="/tabs/tab4"
            routerDirection="root"
            routerLinkActive="selected-menu-item"
            detail="false"
            class="nav-menu-item"
          >
            <ion-icon slot="start" name="grid-outline" aria-hidden="true"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- 6. Preferences Vault -->
        <ion-menu-toggle autoHide="false">
          <ion-item
            button
            routerLink="/storage"
            routerDirection="forward"
            routerLinkActive="selected-menu-item"
            detail="false"
            class="nav-menu-item"
          >
            <ion-icon slot="start" name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
            <ion-label>Preferences Vault</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Main Router Content -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
